<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugar Thumble demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;height:100%;background:#1a0f2e;color:#fff;font:16px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:fixed;inset:0;overflow:hidden;background:#2a1650}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;font-size:16px}
#ui>*{position:absolute;left:0;top:0;white-space:nowrap}
.box{padding:.45em .9em;border-radius:.8em;background:rgba(58,20,110,.6);text-shadow:0 .1em .3em rgba(60,10,90,.8)}
.box small{display:block;font-weight:800;letter-spacing:.06em;color:#ff7ad1;font-size:.8em}
.box b{font-size:1.5em;font-variant-numeric:tabular-nums}
#betb{text-align:right}
#spin{pointer-events:auto;border-radius:50%;border:.25em solid #fff;background:radial-gradient(circle at 35% 30%,#ff8bd8,#d81b8a 70%);color:#fff;font:inherit;font-weight:900;letter-spacing:.04em;cursor:pointer;box-shadow:0 .4em 1.2em rgba(80,0,90,.55);padding:0}
#spin:disabled{filter:grayscale(.6) brightness(.8);cursor:default}
#spin:focus-visible{outline:.2em solid #ffe36b;outline-offset:.2em}
#win{padding:.15em .7em;border-radius:.6em;background:rgba(58,20,110,.6);font-size:1.7em;font-weight:900;color:#ffe36b;text-shadow:0 .08em 0 #c2185b,0 .2em .5em rgba(60,10,90,.9);opacity:0;transition:opacity .2s}
#mute{pointer-events:auto;width:2.8em;height:2.8em;border-radius:50%;border:.14em solid #fff;background:rgba(58,20,110,.6);color:#fff;font:inherit;font-size:1.1em;cursor:pointer;padding:0}
#mute[aria-pressed=true]{opacity:.45;text-decoration:line-through}
#msg{position:absolute;inset:0;display:grid;place-items:center;font-size:1.4em;text-align:center;padding:1em;background:#2a1650}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <div id="ui">
    <div class="box" id="bal"><small>BALANCE</small><b id="balv">$1,000.00</b></div>
    <div class="box" id="betb"><small>BET</small><b>$1.00</b></div>
    <div id="win"></div>
    <button id="spin" disabled aria-label="Spin">SPIN</button>
    <button id="mute" aria-label="Dźwięk" aria-pressed="false">♪</button>
  </div>
  <div id="msg">Ładowanie…</div>
</div></div>
<script src="spine-player.min.js"></script>

let actx = null, muted = false; const buf = {}, lastPlay = {};

}

const forced = [];
function pick() { if (forced.length) return forced.shift(); if (!active) newSet(); let t = 0; for (const k in active) t += active[k]; let r = Math.random() * t; for (const k in active) { r -= active[k]; if (r <= 0) return k; } return 'cookie'; }

    for (const n of ['logo', 'frame', 'background']) load('sugar_' + n, 'sugar_' + n);

    // the board (about 1000 x 1080 world units around the centre) always fits; wider screens see more of the scene, tall ones more sky and ground
    // Responsive: the whole game is always visible, whatever the window shape.
    //  wide window  -> side layout: logo left, board centre, button right (the full 1920 x 1080 scene, more of it when wider/taller)
    //  narrower     -> stacked layout: logo above the board, controls below it
    const asp = canvas.width / canvas.height, stacked = asp < 1.2;
    const VW = stacked ? Math.max(1600, 1060 / asp) * asp : Math.max(1920, 1080 * asp), VH = VW / asp;
    cam.position.x = W / 2; cam.position.y = H / 2; cam.viewportWidth = VW; cam.viewportHeight = VH; cam.zoom = 1; cam.update();
    bg.sk.scaleX = bg.sk.scaleY = Math.max(VW / 3840, VH / 2160);
    const L = W / 2 - VW / 2, B = H / 2 - VH / 2, free = (VH - H) / 2;          // left / bottom edge of the view in world units; spare room above and below the board
    if (stacked) { const ls = Math.min(.5, (free - 10) / 830, VW / 1000); logo.sk.scaleX = logo.sk.scaleY = ls; logo.sk.x = W / 2; logo.sk.y = H + free / 2 - 15; }
    else { logo.sk.scaleX = logo.sk.scaleY = .5; logo.sk.x = L + 262; logo.sk.y = H - 250; }
    const key = canvas.width + 'x' + canvas.height;
    if (key !== layoutKey) {
      layoutKey = key; const k = canvas.clientWidth / VW, ui = $('ui'); ui.style.fontSize = Math.max(9, 23 * k * (stacked ? 1.25 : 1)) + 'px';
      const put = (id, x, y, ax, ay) => { $(id).style.transform = `translate(${(x - L) * k}px, ${(H / 2 + VH / 2 - y) * k}px) translate(${-ax * 100}%, ${-ay * 100}%)`; };
      const size = (id, d) => { $(id).style.width = $(id).style.height = d * k + 'px'; };
      if (stacked) {
        const d = Math.min(250, free * .6); size('spin', d); $('spin').style.fontSize = d * k * .2 + 'px';
        put('spin', W / 2, -free * .47, .5, .5); put('bal', L + 40, B + 30, 0, 1); put('betb', L + VW - 40, B + 30, 1, 1); put('win', W / 2, -8, .5, 0); put('mute', L + VW - 40, B + VH - 40, 1, 0);
      } else {
        size('spin', 230); $('spin').style.fontSize = 230 * k * .2 + 'px';
        put('spin', L + VW - 190, 345, .5, .5); put('bal', L + 50, B + 40, 0, 1); put('betb', L + VW - 50, B + 40, 1, 1); put('win', W / 2, B + 12, .5, 1); put('mute', L + VW - 50, B + VH - 50, 1, 0);
      }
    }
    c.clear(.16, .09, .31, 1);
    R.begin();
    R.drawSkeleton(bg.sk, true);
    const bx = GX - 14, by = H - GTOP - N * CELL - 14, bw = N * CELL + 28, bh = N * CELL + 28;
    R.rect(true, bx, by, bw, bh, new spine.Color(.42, .27, .86, .82));
    for (let cc = 0; cc < N; cc++) for (let r = 0; r < N; r++) R.rect(true, cellX(cc) - CELL / 2 + 5, cellY(r) - CELL / 2 + 5, CELL - 10, CELL - 10, new spine.Color(.55, .40, .95, .28));
    R.end();
    // symbols: clipped to the board while they fall in from above
    const sy = canvas.height / VH, wy = y => (y - B) * sy;
    const list = []; for (const col of grid) for (const o of col) if (o) list.push(o); for (const o of dying) list.push(o);
    list.sort((a, b) => a.front - b.front || b.y - a.y);
    const y0 = Math.round(wy(by + 6)), y1 = Math.round(wy(H - GTOP + 16));
    gl.enable(gl.SCISSOR_TEST); gl.scissor(0, y0, canvas.width, y1 - y0);
    R.begin(); for (const o of list) if (o.falling || o.clip) R.drawSkeleton(o.sk, true); R.end();
    gl.disable(gl.SCISSOR_TEST);
    R.begin(); for (const o of list) if (!(o.falling || o.clip)) R.drawSkeleton(o.sk, true); R.end();
    R.begin(); R.drawSkeleton(frame.sk, true); R.drawSkeleton(logo.sk, true); R.end();
  },
  error(c, errs) { $('msg').style.display = 'grid'; $('msg').textContent = 'Nie udało się wczytać plików: ' + Object.keys(errs).join(', '); }
};

// ---------------------------------------------------------------- board logic
function drop(o, c, r, fromRow, delay) {
  return new Promise(res => { o.x = cellX(c); o.ty = cellY(r); o.y = cellY(fromRow); o.landAnim = true; o.clip = true; o.onLand = () => { o.clip = false; res(); }; later(() => { o.falling = true; }, delay ); });
}
// Every round starts with the same X blocks: they shape the play field into a heart. They never fall; a win next to one or a bomb breaks it,
// which opens its cell for the rest of the round. The next spin puts all of them back.
const MASK = ['X..X..X', '.......', '.......', '.......', 'X.....X', 'XX...XX', 'XXX.XXX'];
const blocked = (c, r) => !!grid[c][r] && grid[c][r].name === 'blocker';
function placeBlockers(back) {
  for (let c = 0; c < N; c++) for (let r = 0; r < N; r++) if (MASK[r][c] === 'X' && !blocked(c, r)) { const o = make('blocker'); if (back) play(o, 'land', false, 'idle'); else { play(o, 'idle', true); o.st.getCurrent(0).trackTime = Math.random() * 3; } o.x = cellX(c); o.y = o.ty = cellY(r); o.front = .5; grid[c][r] = o; }
}
async function fill() {
  const ps = [];
  for (let c = 0; c < N; c++) {
    // gravity inside the free cells of the column: survivors settle at the bottom, new sweets come in from the top (passing behind the X blocks)
    const rows = []; for (let r = 0; r < N; r++) if (!blocked(c, r)) rows.push(r);
    const col = rows.map(r => grid[c][r]).filter(o => o); const missing = rows.length - col.length;
    for (const r of rows) grid[c][r] = null;
    col.forEach((o, i) => { const r = rows[missing + i]; grid[c][r] = o; if (Math.abs(o.y - cellY(r)) > 1) { o.ty = cellY(r); o.landAnim = true; o.col = c; ps.push(new Promise(res => { o.onLand = res; later(() => { o.falling = true; }, c * 35); })); } });
    for (let i = 0; i < missing; i++) {
      const o = make(pick()); play(o, 'idle', true); o.st.getCurrent(0).trackTime = Math.random() * 3; o.col = c; grid[c][rows[i]] = o;
      ps.push(drop(o, c, rows[i], i - missing - 1.2, c * 45 + (missing - 1 - i) * 55));
    }
  }
  await Promise.all(ps); await sleep(160);
}
function clusters() {
  const seen = new Set(), out = [], key = (c, r) => c * 10 + r, nm = (c, r) => grid[c][r] && grid[c][r].name;
  for (const target of PAY) {
    const vis = new Set();
    for (let c = 0; c < N; c++) for (let r = 0; r < N; r++) {
      if (nm(c, r) !== target || vis.has(key(c, r))) continue;
      const q = [[c, r]], cells = []; vis.add(key(c, r));
      while (q.length) { const [a, b] = q.pop(); cells.push([a, b]); for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const x = a + da, y = b + db; if (x < 0 || y < 0 || x >= N || y >= N || vis.has(key(x, y))) continue; const n = nm(x, y); if (n === target || n === 'wild') { vis.add(key(x, y)); q.push([x, y]); } } }
      for (const [a, b] of cells) if (nm(a, b) === 'wild') vis.delete(key(a, b));        // a wild may serve another cluster of this symbol too
      if (cells.filter(([a, b]) => nm(a, b) === target).length >= 1 && cells.length >= MIN_CLUSTER) out.push({ target, cells });
    }
  }
  return out;
}
let shown = 0, target = 0, label = 'WIN ';
function showWin(v, total) { target = v; label = total ? 'TOTAL WIN ' : 'WIN '; if (total) shown = v; $('win').style.opacity = 1; drawWin(); }
function drawWin() { $('win').textContent = label + '$' + shown.toFixed(2); }
async function removeCells(cells, anim) {
  let longest = 0;
  for (const [c, r] of cells) { const o = grid[c][r]; if (!o) continue; grid[c][r] = null; o.front = 2; longest = Math.max(longest, play(o, anim, false)); dying.push(o); }
  await sleep(longest * 1000 ); dying.length = 0;
}
async function resolve() {
  let total = 0, mult = 0;
  for (;;) {
    const cl = clusters();
    if (cl.length) {
      const cells = new Map(); let win = 0;
      for (const k of cl) { win += VALUE[k.target] * (k.cells.length - MIN_CLUSTER + 1) * (1 + .25 * (k.cells.length - MIN_CLUSTER)); for (const [c, r] of k.cells) cells.set(c * 10 + r, [c, r]); }
      mult++; total += win;
      for (const [c, r] of cells.values()) { const o = grid[c][r]; o.front = 1; play(o, 'win', true); }
      if (cells.size >= 8 || mult >= 2) { frame.st.setAnimation(0, 'win', false); frame.st.addAnimation(0, 'idle', true, 0); logo.st.setAnimation(0, 'win', false); logo.st.addAnimation(0, 'idle', true, 0); }
      sfx('win_' + Math.min(4, mult)); showWin(total, false); await sleep(1000);
      // X blocks touching the winning sweets break with them
      const kill = new Map(cells); let boxes = 0;
      for (const [c, r] of cells.values()) for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const x = c + da, y = r + db; if (x >= 0 && y >= 0 && x < N && y < N && blocked(x, y) && !kill.has(x * 10 + y)) { kill.set(x * 10 + y, [x, y]); boxes++; } }
      sfx('destroy'); if (boxes) sfx('blocker_hit', 1, .8); await removeCells([...kill.values()], 'destroy'); await fill(); continue;
    }
    // no cluster: a bomb on the board goes off and clears its 3 x 3 neighbourhood
    let bomb = null; for (let c = 0; c < N && !bomb; c++) for (let r = 0; r < N; r++) if (grid[c][r] && grid[c][r].name === 'bomb') { bomb = [c, r]; break; }
    if (bomb) {
      const [bc, br] = bomb, b = grid[bc][br]; grid[bc][br] = null; b.front = 3; dying.push(b); const d = play(b, 'explode', false); sfx('bomb_explode');
      await sleep(620 );                                                             // the blast itself starts ~0.65 s in
      const cells = []; for (let c = bc - 1; c <= bc + 1; c++) for (let r = br - 1; r <= br + 1; r++) if (c >= 0 && r >= 0 && c < N && r < N && grid[c][r] && grid[c][r].name !== 'bomb' && grid[c][r].name !== 'wild') cells.push([c, r]);      // wilds survive the blast, other bombs go off next
      frame.st.setAnimation(0, 'win', false); frame.st.addAnimation(0, 'idle', true, 0);
      sfx('blocker_hit', 1, .7); const keep = dying.slice(); for (const [c, r] of cells) { const o = grid[c][r]; grid[c][r] = null; o.front = 2; play(o, 'destroy', false); keep.push(o); }
      dying = keep; await sleep(Math.max(d * 1000 - 620, 720)); dying = [];
      await fill(); continue;
    }
    break;
  }
  if (total > 0) { balance += total; showWin(total, true); sfx('total_win'); }
  $('balv').textContent = '$' + balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  busy = false; $('spin').disabled = false;
}
async function spin() {
  audioOn(); if (busy) return; busy = true; sfx('ui_click'); sfx('spin'); $('spin').disabled = true; $('win').style.opacity = 0; shown = target = 0; balance -= 1;
  $('balv').textContent = '$' + balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // the old board drops out through the bottom
  const out = []; for (let c = 0; c < N; c++) { for (let r = 0; r < N; r++) { const o = grid[c][r]; if (!o || o.name === 'blocker') continue; grid[c][r] = null; o.ty = -400; o.landAnim = false; o.onLand = null; o.clip = true; out.push(o); later(() => { o.falling = true; }, (c * 40 + (N - 1 - r) * 12) ); } }
  dying = out; await sleep(760); dying = [];
  newSet(); placeBlockers(true);
  await fill(); await resolve();
}

canvas = $('c');
$('spin').addEventListener('click', spin);
const toggleMute = () => { audioOn(); muted = !muted; $('mute').setAttribute('aria-pressed', String(muted)); };
$('mute').addEventListener('click', toggleMute);
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); spin(); } else if (e.code === 'KeyM') toggleMute(); });
if (typeof spine === 'undefined') $('msg').textContent = 'Nie udało się wczytać odtwarzacza Spine.';
else new spine.SpineCanvas(canvas, { app, webglConfig: { alpha: false, premultipliedAlpha: true, antialias: true } });
}
</script>
