  font: 500 14px var(--ui); padding: 5px 8px; margin: 1px 0; cursor: pointer; }

<script>/* Mini Spine 4.2 JSON runtime (WebGL): bones, regions, meshes (weighted), clipping, IK, path constraints,
   bone/slot/drawOrder/ik/path timelines with bezier curves. No physics, no deform timelines. */
(function (global) {
  'use strict';
  const DEG = Math.PI / 180;

  // ------------------------------------------------------------------ atlas
  function parseAtlas(text) {
    const pages = []; let page = null; let region = null;
    const lines = text.split(/\r?\n/);
    for (let raw of lines) {
      const line = raw.trim();
      if (!line) { page = null; region = null; continue; }
      const ci = line.indexOf(':');
      if (ci < 0) {
        if (!page) { page = { name: line, w: 0, h: 0, pma: false, regions: [] }; pages.push(page); region = null; }
        else { region = { name: line, page, x: 0, y: 0, w: 0, h: 0, ox: 0, oy: 0, ow: 0, oh: 0, deg: 0 }; page.regions.push(region); }
        continue;
      }
      const key = line.slice(0, ci).trim(), val = line.slice(ci + 1).trim();
      const nums = val.split(',').map(Number);
      if (!region) {
        if (key === 'size') { page.w = nums[0]; page.h = nums[1]; }
        else if (key === 'pma') page.pma = val === 'true';
        continue;
      }
      if (key === 'bounds') { [region.x, region.y, region.w, region.h] = nums; }
      else if (key === 'xy') { region.x = nums[0]; region.y = nums[1]; }
      else if (key === 'size') { region.w = nums[0]; region.h = nums[1]; }
      else if (key === 'offsets') { [region.ox, region.oy, region.ow, region.oh] = nums; }
      else if (key === 'offset') { region.ox = nums[0]; region.oy = nums[1]; }
      else if (key === 'orig') { region.ow = nums[0]; region.oh = nums[1]; }
      else if (key === 'rotate') region.deg = val === 'true' ? 90 : (val === 'false' ? 0 : Number(val));
    }
    const regions = {};
    for (const p of pages) for (const r of p.regions) {
      if (!r.ow) { r.ow = r.w; r.oh = r.h; }
      r.u = r.x / p.w; r.v = r.y / p.h;
      if (r.deg === 90) { r.u2 = (r.x + r.h) / p.w; r.v2 = (r.y + r.w) / p.h; }
      else { r.u2 = (r.x + r.w) / p.w; r.v2 = (r.y + r.h) / p.h; }
      regions[r.name] = r;
    }
    return { pages, regions };
  }

  // ------------------------------------------------------------------ curves
  function bezierY(t0, v0, t1, v1, c, t) {
    const [cx1, cy1, cx2, cy2] = c;
    let lo = 0, hi = 1;
    for (let i = 0; i < 30; i++) {
      const s = (lo + hi) / 2, m = 1 - s;
      const x = m * m * m * t0 + 3 * m * m * s * cx1 + 3 * m * s * s * cx2 + s * s * s * t1;
      if (x < t) lo = s; else hi = s;
    }
    const s = (lo + hi) / 2, m = 1 - s;
    return m * m * m * v0 + 3 * m * m * s * cy1 + 3 * m * s * s * cy2 + s * s * s * v1;
  }
  // keys: [{time, curve, ...}], fields: names, defs: default values. returns null before first key.
  function sample(keys, t, fields, defs) {
    if (!keys || !keys.length) return null;
    const get = (k) => fields.map((f, i) => (k[f] !== undefined ? k[f] : defs[i]));
    if (t < (keys[0].time || 0)) return null;
    for (let i = 0; i < keys.length - 1; i++) {
      const k0 = keys[i], k1 = keys[i + 1], t0 = k0.time || 0, t1 = k1.time || 0;
      if (t >= t0 && t < t1) {
        const a = get(k0), b = get(k1), c = k0.curve;
        if (c === 'stepped') return a;
        if (!c) { const p = (t - t0) / (t1 - t0); return a.map((v, j) => v + (b[j] - v) * p); }
        return a.map((v, j) => bezierY(t0, v, t1, b[j], c.slice(j * 4, j * 4 + 4), t));
      }
    }
    return get(keys[keys.length - 1]);
  }
  function hexColor(h) {
    if (!h) return [1, 1, 1, 1];
    const n = (i) => parseInt(h.substr(i, 2), 16) / 255;
    return [n(0), n(2), n(4), h.length >= 8 ? n(6) : 1];
  }

  // ------------------------------------------------------------------ skeleton
  class Skeleton {
    constructor(json, atlas) {
      this.data = json; this.atlas = atlas;
      this.bones = json.bones.map((b) => ({ data: b, parent: null, children: [], w: [1, 0, 0, 1, 0, 0] }));
      this.boneByName = {};
      this.bones.forEach((b, i) => { b.index = i; this.boneByName[b.data.name] = b; });
      for (const b of this.bones) if (b.data.parent) { b.parent = this.boneByName[b.data.parent]; b.parent.children.push(b); }
      this.slots = (json.slots || []).map((s, i) => ({ data: s, index: i, bone: this.boneByName[s.bone] }));
      this.slotByName = {}; this.slots.forEach((s) => (this.slotByName[s.data.name] = s));
      // skins: 4.x array form or 3.x object form
      let skins = json.skins || [];
      if (!Array.isArray(skins)) skins = Object.keys(skins).map((k) => ({ name: k, attachments: skins[k] }));
      this.skins = skins;
      this.skinNames = skins.map((s) => s.name);
      this.setSkin(this.skinNames.includes('default') ? 'default' : this.skinNames[0]);
      this.ik = (json.ik || []).map((c) => ({ data: c, kind: 'ik' }));
      this.paths = (json.path || []).map((c) => ({ data: c, kind: 'path' }));
      this.constraints = [...this.ik, ...this.paths].sort((a, b) => (a.data.order || 0) - (b.data.order || 0));
      this.animations = json.animations || {};
      this.durations = {};
      for (const name in this.animations) this.durations[name] = animDuration(this.animations[name]);
      this.missing = new Set();
      this.setupPose();
    }
    setSkin(name) {
      this.skin = name;
      const def = this.skins.find((s) => s.name === 'default');
      const sk = this.skins.find((s) => s.name === name);
      this.attachments = {};
      for (const src of [def, sk]) {
        if (!src) continue;
        for (const slot in src.attachments) {
          this.attachments[slot] = this.attachments[slot] || {};
          Object.assign(this.attachments[slot], src.attachments[slot]);
        }
      }
    }
    setupPose() {
      for (const b of this.bones) {
        const d = b.data;
        b.x = d.x || 0; b.y = d.y || 0; b.rot = d.rotation || 0;
        b.sx = d.scaleX !== undefined ? d.scaleX : 1; b.sy = d.scaleY !== undefined ? d.scaleY : 1;
        b.shx = d.shearX || 0; b.shy = d.shearY || 0;
      }
      for (const s of this.slots) { s.color = hexColor(s.data.color); s.att = s.data.attachment || null; }
      this.drawOrder = this.slots.slice();
      for (const c of this.ik) { c.mix = c.data.mix !== undefined ? c.data.mix : 1; c.bend = c.data.bendPositive === false ? -1 : 1; }
      for (const c of this.paths) {
        c.position = c.data.position || 0; c.spacing = c.data.spacing || 0;
        c.mixRotate = c.data.mixRotate !== undefined ? c.data.mixRotate : (c.data.rotateMix !== undefined ? c.data.rotateMix : 1);
        c.mixX = c.data.mixX !== undefined ? c.data.mixX : (c.data.translateMix !== undefined ? c.data.translateMix : 1);
        c.mixY = c.data.mixY !== undefined ? c.data.mixY : c.mixX;
      }
    }
    apply(name, t) {
      this.setupPose();
      const a = this.animations[name];
      if (!a) return;
      for (const bn in a.bones || {}) {
        const b = this.boneByName[bn]; if (!b) continue;
        const tl = a.bones[bn];
        let v;
        if ((v = sample(tl.rotate, t, ['value', 'angle'], [0, 0]))) b.rot += (isFinite(v[0]) && v[0]) || (isFinite(v[1]) ? v[1] : 0);
        if ((v = sample(tl.translate, t, ['x', 'y'], [0, 0]))) { b.x += v[0]; b.y += v[1]; }
        if ((v = sample(tl.translatex, t, ['value'], [0]))) b.x += v[0];
        if ((v = sample(tl.translatey, t, ['value'], [0]))) b.y += v[0];
        if ((v = sample(tl.scale, t, ['x', 'y'], [1, 1]))) { b.sx *= v[0]; b.sy *= v[1]; }
        if ((v = sample(tl.scalex, t, ['value'], [1]))) b.sx *= v[0];
        if ((v = sample(tl.scaley, t, ['value'], [1]))) b.sy *= v[0];
        if ((v = sample(tl.shear, t, ['x', 'y'], [0, 0]))) { b.shx += v[0]; b.shy += v[1]; }
      }
      for (const sn in a.slots || {}) {
        const s = this.slotByName[sn]; if (!s) continue;
        const tl = a.slots[sn];
        if (tl.attachment) {
          let cur = null, hit = false;
          for (const k of tl.attachment) if ((k.time || 0) <= t + 1e-6) { cur = k.name === undefined ? null : k.name; hit = true; }
          if (hit) s.att = cur;
        }
        let v;
        if (tl.rgba || tl.color) {
          const keys = (tl.rgba || tl.color).map((k) => Object.assign({}, k, (() => { const c = hexColor(k.color); return { r: c[0], g: c[1], b: c[2], a: c[3] }; })()));
          if ((v = sample(keys, t, ['r', 'g', 'b', 'a'], [1, 1, 1, 1]))) s.color = v;
        }
        if (tl.rgb) {
          const keys = tl.rgb.map((k) => Object.assign({}, k, (() => { const c = hexColor(k.color); return { r: c[0], g: c[1], b: c[2] }; })()));
          if ((v = sample(keys, t, ['r', 'g', 'b'], [1, 1, 1]))) s.color = [v[0], v[1], v[2], s.color[3]];
        }
        if ((v = sample(tl.alpha, t, ['value'], [1]))) s.color = [s.color[0], s.color[1], s.color[2], v[0]];
      }
      if (a.drawOrder || a.draworder) {
        let cur = null;
        for (const k of a.drawOrder || a.draworder) if ((k.time || 0) <= t + 1e-6) cur = k;
        if (cur && cur.offsets) {
          const n = this.slots.length, out = new Array(n).fill(null), unchanged = [];
          let orig = 0;
          for (const o of cur.offsets) {
            const si = this.slotByName[o.slot].index;
            while (orig !== si) unchanged.push(this.slots[orig++]);
            out[orig + o.offset] = this.slots[orig++];
          }
          while (orig < n) unchanged.push(this.slots[orig++]);
          let ui = unchanged.length - 1;
          for (let i = n - 1; i >= 0; i--) if (!out[i]) out[i] = unchanged[ui--];
          this.drawOrder = out;
        }
      }
      for (const cn in a.ik || {}) {
        const c = this.ik.find((x) => x.data.name === cn); if (!c) continue;
        const k = a.ik[cn]; const v = sample(k, t, ['mix'], [1]);
        if (v) c.mix = v[0];
        let cur = null; for (const kk of k) if ((kk.time || 0) <= t + 1e-6) cur = kk;
        if (cur && cur.bendPositive !== undefined) c.bend = cur.bendPositive ? 1 : -1;
      }
      for (const cn in a.path || {}) {
        const c = this.paths.find((x) => x.data.name === cn); if (!c) continue;
        const tl = a.path[cn]; let v;
        if ((v = sample(tl.position, t, ['value', 'position'], [0, 0]))) c.position = tl.position[0].value !== undefined ? v[0] : v[1];
        if ((v = sample(tl.spacing, t, ['value', 'spacing'], [0, 0]))) c.spacing = tl.spacing[0].value !== undefined ? v[0] : v[1];
      }
    }
    // world transforms
    updateBone(b) {
      const rx = (b.rot + b.shx) * DEG, ry = (b.rot + 90 + b.shy) * DEG;
      const la = Math.cos(rx) * b.sx, lb = Math.cos(ry) * b.sy, lc = Math.sin(rx) * b.sx, ld = Math.sin(ry) * b.sy;
      if (b.parent) {
        const p = b.parent.w;
        b.w = [p[0] * la + p[1] * lc, p[0] * lb + p[1] * ld, p[2] * la + p[3] * lc, p[2] * lb + p[3] * ld,
               p[0] * b.x + p[1] * b.y + p[4], p[2] * b.x + p[3] * b.y + p[5]];
      } else b.w = [la, lb, lc, ld, b.x, b.y];
    }
    updateTree(b) { this.updateBone(b); for (const c of b.children) this.updateTree(c); }
    updateWorld() {
      for (const b of this.bones) this.updateBone(b);
      for (const c of this.constraints) {
        if (c.kind === 'ik') this.applyIk(c); else this.applyPath(c);
      }
    }
    worldAngle(b) { return Math.atan2(b.w[2], b.w[0]) / DEG; }
    applyIk(c) {
      if (c.mix <= 0) return;
      const bones = c.data.bones.map((n) => this.boneByName[n]); const tgt = this.boneByName[c.data.target];
      const T = [tgt.w[4], tgt.w[5]];
      const parentAngle = (b) => (b.parent ? this.worldAngle(b.parent) : 0);
      if (bones.length === 1) {
        const b = bones[0];
        const ang = Math.atan2(T[1] - b.w[5], T[0] - b.w[4]) / DEG - parentAngle(b) - (b.shx || 0);
        b.rot += (wrap(ang - b.rot)) * c.mix;
        if (c.data.stretch && b.data.length) {
          const ps = b.parent ? Math.hypot(b.parent.w[0], b.parent.w[2]) : 1;
          const d = Math.hypot(T[0] - b.w[4], T[1] - b.w[5]) / (b.data.length * ps);
          if (d > 1 || c.data.compress) b.sx = d;
        }
        this.updateTree(b); return;
      }
      const [p, ch] = bones;
      const P = [p.w[4], p.w[5]], C = [ch.w[4], ch.w[5]];
      const l1 = Math.hypot(C[0] - P[0], C[1] - P[1]);
      const sc = Math.hypot(ch.w[0], ch.w[2]);
      const l2 = (ch.data.length || 0) * sc;
      let dist = Math.hypot(T[0] - P[0], T[1] - P[1]);
      dist = Math.min(Math.max(dist, Math.abs(l1 - l2) + 1e-3), l1 + l2 - 1e-3);
      const alpha = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist))));
      const th = Math.atan2(T[1] - P[1], T[0] - P[0]) + c.bend * alpha;
      const Cn = [P[0] + l1 * Math.cos(th), P[1] + l1 * Math.sin(th)];
      const thc = Math.atan2(T[1] - Cn[1], T[0] - Cn[0]);
      const pr = th / DEG - parentAngle(p), cr = (thc - th) / DEG;
      p.rot += wrap(pr - p.rot) * c.mix; ch.rot += wrap(cr - ch.rot) * c.mix;
      this.updateTree(p);
    }

}
function refreshItems() {
  for (const b of side.querySelectorAll('.item')) {
    const has = !!(EMBEDDED[b.dataset.name] || userFiles[b.dataset.name]);
    b.classList.toggle('on', b.dataset.name === item);
    b.classList.toggle('empty', !has);
  }
}

// ---------------------------------------------------------------- loading
function loadImage(src) { return new Promise((ok, err) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => err(new Error('obraz')); im.src = src; }); }
async function build(name) {
  if (loaded[name]) return loaded[name];
  const src = userFiles[name] || EMBEDDED[name];
  if (!src) return null;
  const json = typeof src.json === 'string' ? JSON.parse(src.json) : src.json;
  const atlas = MiniSpine.parseAtlas(src.atlas);
  const skel = new MiniSpine.Skeleton(json, atlas);
  const textures = new Map(); const missing = [];
  for (const p of atlas.pages) {
    const url = src.images[p.name] || src.images[p.name.split('/').pop()];
    if (!url) { missing.push(p.name); continue; }
    const im = await loadImage(url);
    textures.set(p, R.makeTex(im, p.pma));

}
function defaultAnim(skel) {
  const names = Object.keys(skel.animations);
  for (const pref of ['win', 'hit', 'idle', 'animation']) if (names.includes(pref)) return pref;
  return names.find((n) => skel.durations[n] > 0) || names[0] || null;
}
async function select(name) {
  item = name; refreshItems();
  const L = R ? await build(name) : null;
  if (item !== name) return;
  cur = L ? L.skel : null; curTex = L ? L.textures : null;
  $('empty').hidden = !!cur;
  if (!cur) {
    $('empty').innerHTML = `<div>Brak eksportu dla <b>${name}</b>.<br>Przeciągnij tutaj pliki .json, .atlas i .png albo <u style="pointer-events:auto;cursor:pointer" id="pick">wybierz pliki</u>.</div>`;
    const pk = document.getElementById('pick'); if (pk) pk.onclick = () => $('files').click();
    $('tabs').innerHTML = ''; $('note').hidden = true; updateTime(); return;
  }
  const miss = [...L.missing, ...[...cur.missing]];
  $('note').hidden = !miss.length; $('note').textContent = miss.length ? 'Brak plików: ' + miss.join(', ') : '';
  renderTabs(); play(defaultAnim(cur)); fit();
}
function renderTabs() {
  const tabs = $('tabs'); tabs.innerHTML = '';
  for (const n of Object.keys(cur.animations)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab' + (n === anim ? ' on' : ''); b.textContent = n;
    b.addEventListener('click', () => { play(n); fit(); });
    tabs.appendChild(b);
  }
}
function play(n) {
  anim = n; time = 0; playing = true; $('play').textContent = 'Pause';
  for (const b of $('tabs').children) b.classList.toggle('on', b.textContent === n);
}
function dur() { return cur && anim ? cur.durations[anim] || 0 : 0; }

// ---------------------------------------------------------------- camera
function resize() {
  const r = view.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
}
function fit() {
  if (!cur) return;
  resize();
  let b = null; const D = dur(), steps = D > 0 ? 12 : 1;
  for (let i = 0; i < steps; i++) {
    cur.apply(anim, D * i / steps); cur.updateWorld();
    const bb = cur.bounds(); if (!bb) continue;
    b = b ? [Math.min(b[0], bb[0]), Math.min(b[1], bb[1]), Math.max(b[2], bb[2]), Math.max(b[3], bb[3])] : bb;
  }
  if (!b) { cam = { x: 0, y: 0, zoom: 1 }; return; }
  const w = b[2] - b[0], h = b[3] - b[1];
  cam.x = (b[0] + b[2]) / 2; cam.y = (b[1] + b[3]) / 2;
  cam.zoom = Math.min(cv.width / (w * 1.35), cv.height / (h * 1.35));
}
let dragging = null;
cv.addEventListener('pointerdown', (e) => { dragging = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
cv.addEventListener('pointermove', (e) => {
  if (!dragging) return; const d = window.devicePixelRatio || 1;
  cam.x -= (e.clientX - dragging.x) * d / cam.zoom; cam.y += (e.clientY - dragging.y) * d / cam.zoom; dragging = { x: e.clientX, y: e.clientY };
});
const endDrag = () => { dragging = null; cv.classList.remove('drag'); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', (e) => {
  e.preventDefault(); const d = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  const mx = ((e.clientX - r.left) * d - cv.width / 2) / cam.zoom + cam.x, my = (cv.height / 2 - (e.clientY - r.top) * d) / cam.zoom + cam.y;
  const k = Math.exp(-e.deltaY * 0.0015); cam.zoom *= k;
  cam.x = mx - (mx - cam.x) / k; cam.y = my - (my - cam.y) / k;

// ---------------------------------------------------------------- transport
$('play').addEventListener('click', () => {
  if (!playing && !$('loop').checked && time >= dur()) time = 0;
  playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play';
});
$('fit').addEventListener('click', fit);
let scrubbing = false;
$('seek').addEventListener('input', (e) => { scrubbing = true; time = dur() * e.target.value / 1000; });
$('seek').addEventListener('change', () => { scrubbing = false; });
$('speed').addEventListener('input', (e) => { $('spdv').textContent = parseFloat(e.target.value).toFixed(1) + 'x'; });
$('bg').addEventListener('change', (e) => { bg = BGS[e.target.value]; });
function updateTime() {
  const D = dur();
  $('time').textContent = `${time.toFixed(2)} / ${D.toFixed(2)} s`;
  if (!scrubbing) $('seek').value = D > 0 ? Math.round(time / D * 1000) : 0;
}

// ---------------------------------------------------------------- drag & drop
async function readFiles(list) {
  const files = [...list]; if (!files.length || !item) return;
  const pack = { json: null, atlas: null, images: {} };
  for (const f of files) {
    const n = f.name.toLowerCase();
    if (n.endsWith('.json')) pack.json = await f.text();
    else if (n.endsWith('.atlas') || n.endsWith('.atlas.txt')) pack.atlas = await f.text();
    else if (/\.(png|webp|jpe?g)$/.test(n)) pack.images[f.name] = URL.createObjectURL(f);
    else if (n.endsWith('.skel')) { alert('Pliki .skel (binarne) nie są obsługiwane – wyeksportuj animację jako JSON.'); }
  }
  if (!pack.json || !pack.atlas) { $('note').hidden = false; $('note').textContent = 'Potrzebne są pliki .json i .atlas (oraz strony atlasu .png).'; return; }
  userFiles[item] = pack; delete loaded[item];
  select(item);
}
view.addEventListener('dragover', (e) => { e.preventDefault(); view.classList.add('dragover'); });
view.addEventListener('dragleave', (e) => { if (e.target === view || !view.contains(e.relatedTarget)) view.classList.remove('dragover'); });
view.addEventListener('drop', (e) => { e.preventDefault(); view.classList.remove('dragover'); readFiles(e.dataTransfer.files); });
$('files').addEventListener('change', (e) => readFiles(e.target.files));

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const c = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  if (Math.round(c.width * d) !== cv.width || Math.round(c.height * d) !== cv.height) resize();
  if (R) {
    const D = dur();
    if (cur && playing && !scrubbing) {
      time += dt * parseFloat($('speed').value);
      if (time >= D) {
        if ($('loop').checked && D > 0) time = time % D;
        else { time = D; playing = false; $('play').textContent = 'Play'; }
      }
    }
    R.begin(bg.map((v) => v / 255), cam);
    if (cur) { cur.apply(anim, Math.min(time, Math.max(D - 1e-5, 0))); cur.updateWorld(); R.draw(cur, curTex); }
    updateTime();
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => { resize(); });
resize(); refreshItems(); select(GROUPS[0][1][0]); requestAnimationFrame(frame);
// comments (only inside the shared claude.ai page): pins the comment to the selected symbol in the list
(async () => {
  const use = window.claude && window.claude.use; if (!use) return;
  let c = null; try { c = await window.claude.use('comments'); } catch (e) { c = null; }
  if (!c) return;
  const btn = $('cmt'); btn.hidden = false;
  btn.addEventListener('click', async () => {
    const el = side.querySelector('.item.on') || side.querySelector('.item');
    try { await c.openComposer({ element: el }); } catch (e) { if (e && (e.code === 'unavailable' || e.code === 'not_granted')) btn.hidden = true; }
  });
})();
window.__app = { get cur() { return cur; }, get time() { return time; }, set time(v) { time = v; }, pause() { playing = false; }, play, fit, get cam() { return cam; }, select };
</script>
